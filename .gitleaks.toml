title = "agent-apis-sdk gitleaks rules"

[extend]
useDefault = true

[[rules]]
id = "xrpl-family-seed-secp256k1"
description = "XRPL family seed (secp256k1): s + 28 base58 characters"
regex = '''\bs[1-9A-HJ-NP-Za-km-z]{28}\b'''
keywords = ["s"]

[[rules]]
id = "xrpl-family-seed-ed25519"
description = "XRPL family seed (ed25519): sEd + 28 base58 characters"
regex = '''\bsEd[1-9A-HJ-NP-Za-km-z]{28}\b'''
keywords = ["sed"]

[[rules]]
id = "hex-private-key-near-keyword"
description = "64-hex private key next to a seed, secret or private keyword"
regex = '''(?i)(?:seed|secret|private)[a-z0-9_ .-]{0,30}["'=: ]{1,5}[0-9a-f]{64}\b'''
keywords = ["seed", "secret", "private"]

[[rules]]
id = "solana-keypair-base58"
description = "Solana 64-byte keypair as a base58 secret key (87 or 88 characters)"
regex = '''\b[1-9A-HJ-NP-Za-km-z]{87,88}\b'''

[[rules]]
id = "solana-keypair-json-array"
description = "Solana 64-byte keypair as a JSON array of 64 integers"
regex = '''\[\s*(?:\d{1,3}\s*,\s*){63}\d{1,3}\s*\]'''
keywords = ["["]

[[rules]]
id = "criptonlabs-prepaid-token"
description = "Criptonlabs prepaid credit token: clc_<kid>.<rid>.<rnd>.<mac>, base64url parts"
regex = '''\bclc_[A-Za-z0-9_-]{1,64}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{16,}'''
keywords = ["clc_"]

[[rules]]
id = "cripton-seed-or-secret-assignment"
description = "CRIPTON_*_SEED= or CRIPTON_*_SECRET= assignment with a value"
regex = '''(?i)\bCRIPTON_[A-Z0-9_]*(?:SEED|SECRET)[ \t]*=[ \t]*["']?[^\s"'#<]+'''
keywords = ["cripton_"]

[[rules]]
id = "cripton-key-assignment"
description = "CRIPTON_*_KEY= assignment with a value (Solana payer key and future keys)"
# A value starting with $ is a shell substitution (for example "$(cat id.json)"), not a secret.
regex = '''(?i)\bCRIPTON_[A-Z0-9_]*_KEY[ \t]*=[ \t]*["']?[^\s"'#<$][^\s"'#<]*'''
keywords = ["cripton_"]

[[allowlists]]
description = "Placeholder lines in .env.example"
condition = "AND"
paths = ['''^\.env\.example$''']
regexes = ['''(?i)=\s*<[^>]*>\s*$''']

[[allowlists]]
description = "Public example values of the API 0.27.0 OpenAPI snapshot (exact values, no paths)"
regexTarget = "secret"
regexes = [
  # PYUSD Token-2022 associated token address, x402 preflight example (source_token_account)
  '''^2cxUQZpW2N3ErXA4C58ZXdCdg2yakyeHhyrsCK33mx6F$''',
  # PYUSD Token-2022 associated token address, x402 preflight example (destination_token_account)
  '''^HJEW6unDU6rmK1g2sWMHLoETYEA3APoWJHYCkSXkg2K2$''',
  # Public token account owner, token_owner example
  '''^fr6yQkDmWy6R6pecbUsxXaw6EvRJznZ2HsK5frQgud8$''',
  # Public XRPL RegularKey of the Bitstamp example (regular_key)
  '''^rUUs1jns6tdUQwAABDJyHMUHvdGNvNADvJ$''',
  # 87-character example transaction signature, Solana payment verify parameter
  '''^B7yABUkY4RudiDfoax94mfqVv2YuNJ4AVsg7LjdFT9Qm8bScsw3PoB2LxpuUqzCkiniKQJ9AKXfSfWaw1kWYFaF$''',
  # Public SPL token account (source) of the recorded Solana transfer-readiness fixture
  '''^FGETo8T8wMcN2wCjav8VK6eh3dLk63evNDPxzLSJra8B$''',
  # Public SPL token account (destination) of the recorded Solana transfer-readiness fixture
  '''^3XZXfFJHF5ox3yPop16oqYfSWxLpkjsEuvTe2S67G2rj$''',
  # Public example Credential id of the kit-api-sync-0-27 xrpl-data-client spec
  '''^006E72B33796BEC170F5732535B6D44E688631B83A0E2E2BBD26E82118EA8290$''',
]
