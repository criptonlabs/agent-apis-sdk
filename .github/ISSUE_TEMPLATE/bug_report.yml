name: Bug report
description: Report something that does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never paste seeds, private keys, tokens or `.env` contents. Report vulnerabilities through SECURITY.md, not here.
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - "@criptonlabs/agent-apis-core"
        - "@criptonlabs/agent-apis-xrpl"
        - "@criptonlabs/agent-apis-solana"
        - Other or unsure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version or commit
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "24.x"
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: Interface used
      options:
        - TypeScript API
        - CLI
        - MCP server
        - Vercel AI SDK
        - Mastra
        - ElizaOS
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the error `code` and `message`. Remove any secrets.
    validations:
      required: true
